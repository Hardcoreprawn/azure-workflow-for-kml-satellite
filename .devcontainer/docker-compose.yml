name: ${COMPOSE_PROJECT_NAME:-canopex-dev}

services:
  devcontainer:
    build:
      context: ${DEV_WORKSPACE:-.}
      dockerfile: Dockerfile.dev
      args:
        UV_VERSION: ${UV_VERSION:-0.11.28}
    image: treesight-dev:local
    # Keep the service process aligned with devcontainer.json's remoteUser so
    # bind-mounted workspace files are never created as root.
    user: vscode
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - ${DEV_WORKSPACE:-.}:/workspace
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-canopex-dev}
      CANOPEX_DEVCONTAINER: "1"
      AZURITE_BLOB_HOST: azurite
      FUNC_URL: http://func:80
      VERIFY_COMPUTE_BASE: http://func:80
      VERIFY_ORCH_BASE: http://orch:80
      VERIFY_WEB_BASE: http://web:4280
      VERIFY_OLLAMA_BASE: http://ollama:11434
    restart: "no"
