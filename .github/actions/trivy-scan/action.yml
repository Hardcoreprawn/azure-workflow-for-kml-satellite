name: "Trivy scan"
description: >-
  Install Trivy once and run a repository scan through the canonical
  `make scan-*` targets. Single source of truth for Trivy in CI: one setup
  action, one run path. The scan flags live in the Makefile, not here, so
  local (`make scan`) and CI runs stay identical.

inputs:
  scan:
    description: "Scan type: iac, fs, or image."
    required: true
  image:
    description: "Image reference to scan (required when scan=image)."
    required: false
    default: ""
  format:
    description: "Trivy output format: table, sarif, or json."
    required: false
    default: "sarif"
  output:
    description: "Output file path (empty writes to stdout)."
    required: false
    default: ""
  ignorefile:
    description: "Trivy ignore file path. To run an unsuppressed scan, use disable-ignore: 'true' instead of passing an empty string here (empty strings are not reliably handled by composite actions)."
    required: false
    default: ".trivyignore"
  disable-ignore:
    description: "Set to 'true' to disable .trivyignore filtering and run an unsuppressed scan (no --ignorefile flag). Overrides ignorefile."
    required: false
    default: "false"
  image-exit:
    description: "Exit code for image scans on findings (0 = advisory, non-blocking)."
    required: false
    default: "1"
  scanners:
    description: "Comma-separated Trivy scanners (e.g. vuln). Empty = Trivy default."
    required: false
    default: ""
  skip-dirs:
    description: "Space-separated in-image directories to exclude from image scans (e.g. bundled dev/CI tool paths never present in the deployed runtime)."
    required: false
    default: ""
  trivy-version:
    description: "Trivy binary version (pinned; keep in sync with Makefile TRIVY_VERSION)."
    required: false
    default: "v0.72.0"

runs:
  using: "composite"
  steps:
    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: ${{ inputs.trivy-version }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run Trivy (${{ inputs.scan }}) via make
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # Pass inputs through env (never interpolate ${{ }} into run: — avoids
        # shell injection; Semgrep run-shell-injection).
        SCAN: ${{ inputs.scan }}
        IMAGE: ${{ inputs.image }}
        TRIVY_FORMAT: ${{ inputs.format }}
        TRIVY_OUTPUT: ${{ inputs.output }}
        TRIVY_IGNOREFILE: ${{ inputs.ignorefile }}
        TRIVY_DISABLE_IGNORE: ${{ inputs.disable-ignore }}
        TRIVY_IMAGE_EXIT: ${{ inputs.image-exit }}
        TRIVY_SCANNERS: ${{ inputs.scanners }}
        TRIVY_SKIP_DIRS: ${{ inputs.skip-dirs }}
      run: |
        # When disable-ignore is true, clear the ignorefile so the Makefile
        # emits no --ignorefile flag regardless of the default.
        if [ "${TRIVY_DISABLE_IGNORE}" = "true" ]; then
          TRIVY_IGNOREFILE=""
        fi
        make "scan-${SCAN}" \
          IMAGE="${IMAGE}" \
          TRIVY_FORMAT="${TRIVY_FORMAT}" \
          TRIVY_OUTPUT="${TRIVY_OUTPUT}" \
          TRIVY_IGNOREFILE="${TRIVY_IGNOREFILE}" \
          TRIVY_IMAGE_EXIT="${TRIVY_IMAGE_EXIT}" \
          TRIVY_SCANNERS="${TRIVY_SCANNERS}" \
          TRIVY_SKIP_DIRS="${TRIVY_SKIP_DIRS}"
