# ─────────────────────────────────────────────────────────────
# CI — Lint, test, build on every push & PR
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    # Include ready_for_review so promoting a draft (manual or via the
    # watchdog auto-promote) actually triggers CI. See #1003/#1004.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  merge_group:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same ref on PRs; never cancel main runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Resolve the published dev image to an immutable digest and check whether the
  # repo's uv.lock still matches the deps baked into it. Gate jobs then run
  # *inside* that exact digest, so `local == CI` is provably the same image.
  # Only image build/publish stays on the bare runner. See ADR 0005 / #1086.
  resolve-image:
    name: Resolve dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      stale: ${{ steps.resolve.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve digest + staleness
        id: resolve
        run: |
          source .github/image-config.env
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/${DEV_IMAGE_REPO}:latest"
          if ! docker pull "${IMAGE}"; then
            echo "::error::dev image ${IMAGE} not found on GHCR — publish it via the Dev Image workflow (#1085) before CI can consume it."
            exit 1
          fi
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")
          echo "image=${DIGEST_REF}" >> "$GITHUB_OUTPUT"
          # Staleness is advisory: a PR that changes uv.lock legitimately runs
          # before the image is rebuilt on merge. Report it and let gate jobs
          # `uv sync` the delta rather than deadlocking dependency PRs.
          if python3 scripts/check_dev_image_staleness.py --image "${IMAGE}"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            LOCK_NOTE="fresh — deps served straight from the image"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            LOCK_NOTE="stale vs uv.lock — gate jobs will \`uv sync\` the delta"
          fi
          {
            echo "### Dev image"
            echo ""
            echo "- Digest: \`${DIGEST_REF}\`"
            echo "- Lock check: ${LOCK_NOTE}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Deps are baked into the dev image; `uv run` must not try to re-sync.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Sync dependency delta (only if image is stale)
        if: needs.resolve-image.outputs.stale == 'true'
        # --inexact preserves packages not in uv.lock (e.g. the treesight_rs
        # wheel installed separately in Dockerfile.dev via `uv pip install`).
        run: uv sync --all-extras --inexact
      # Canonical lint lives in the Makefile (single source of truth shared
      # with local `make lint` / `make check`). See issue #962.
      - run: make lint

  test:
    name: Test
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      AzureWebJobsStorage: "UseDevelopmentStorage=true"
      DEMO_VALET_TOKEN_SECRET: "ci-test-secret"  # pragma: allowlist secret
      CIAM_AUTHORITY: "https://canopex.ciamlogin.com"
      CIAM_TENANT_ID: "ci-test-tenant"
      CIAM_API_AUDIENCE: "api://ci-test-audience"
      # Deps are baked into the dev image; `uv run` must not try to re-sync.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history so diff-cover can find the merge-base with the base branch.
          fetch-depth: 0
      - name: Sync dependency delta (only if image is stale)
        if: needs.resolve-image.outputs.stale == 'true'
        # --inexact preserves packages not in uv.lock (e.g. the treesight_rs
        # wheel installed separately in Dockerfile.dev via `uv pip install`).
        run: uv sync --all-extras --inexact
      # Canonical test command lives in the Makefile (matches local `make test`).
      - run: make test
      # Changed-lines test coverage — REQUIRED GATE (closes #1042).
      # Fails the PR if fewer than 80% of changed Python lines are covered.
      # Config/docs-only PRs are unaffected: diff-cover only measures changed
      # Python lines, so a diff with no Python changes always passes.
      - name: Changed-lines coverage (required gate)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The container runs as a different UID than the checkout, so git
          # refuses to operate on the repo ("dubious ownership") without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # No --depth here: the checkout step already fetches full history
          # for HEAD (fetch-depth: 0), so a shallow base-ref fetch can leave
          # no common ancestor in reach once main has advanced past the PR's
          # branch point, and diff-cover fails with "no merge base".
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          uv run diff-cover coverage.xml \
            --compare-branch "origin/${BASE_REF}" \
            --fail-under 80 \
            --markdown-report diff-cover.md
          {
            echo "## Changed-lines test coverage"
            echo ""
            echo "Target: 80% of changed Python lines covered."
            echo ""
            cat diff-cover.md 2>/dev/null || echo "_diff-cover produced no report (no changed Python lines)._"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration (Azurite)
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Runs the @pytest.mark.integration suite against a real Azurite instance.
    # Azurite needs --skipApiVersionCheck/--loose (the installed azure-storage
    # SDK negotiates an API version newer than Azurite ships, so every request
    # is otherwise rejected), which a GitHub `services:` container cannot pass
    # (no command override). So instead of a container job we drive docker
    # compose on the bare runner: the maintained `azurite` service carries the
    # correct flags + healthcheck, and the `ci-gate` service runs make test-int
    # INSIDE the resolved dev image on the same network — the exact same path as
    # local `make ci-local`. See #1086.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ci-gate runs inside the exact resolved dev image (by digest); the
      # azurite dependency is brought up healthy first via depends_on.
      - name: Integration tests (Azurite via docker compose)
        env:
          CI_GATE_IMAGE: ${{ needs.resolve-image.outputs.image }}
          STALE: ${{ needs.resolve-image.outputs.stale }}
        run: |
          if [ "${STALE}" = "true" ]; then
            # Image deps lag uv.lock (dependency PR before rebuild) — sync the
            # delta inside the gate first, mirroring the lint/test jobs.
            # --inexact preserves treesight_rs (not in uv.lock).
            docker compose --profile ci run --rm ci-gate \
              sh -c "uv sync --all-extras --inexact && make test-int"
          else
            docker compose --profile ci run --rm ci-gate make test-int
          fi
      - name: Tear down compose
        if: always()
        run: docker compose --profile ci down -v --remove-orphans

  # Local/CI pipeline e2e gate (#1215/#1218): proves the real pipeline (parse
  # -> trigger -> orchestrate -> acquire -> fulfil -> enrich -> artifact)
  # against Azurite with a real `func start` host, no live Azure environment
  # and no calls to a real third-party imagery provider (CANOPEX_TEST_MODE).
  #
  # Deliberately NOT run inside the dev container image (ADR 0005 amendment,
  # 2026-08-06): the Durable Task Framework's storage provider hard-resolves
  # the well-known Azurite account name to 127.0.0.1, ignoring
  # AzureWebJobsStorage's actual endpoint host — only correct when Azurite is
  # reachable at the caller's own localhost, which is true for a bare runner
  # (Azurite's ports are published straight to it) and false for a sibling
  # container. treesight_rs (Rust extension) is optional with a pure-Python
  # fallback, so no Rust toolchain is needed on the runner either.
  #
  # Gated on lint/test passing first: this job takes minutes (real func host
  # + Azurite + Durable orchestration), so don't burn that time on a change
  # that a fast lint/unit-test failure would already have caught.
  pipeline-e2e:
    name: Pipeline e2e (local gate)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Install Azure Functions Core Tools
        run: bash scripts/setup_func_tools.sh

      - name: Start Azurite
        run: docker compose up -d azurite

      - name: Wait for Azurite
        run: uv run python scripts/init_storage.py

      - name: Run pipeline e2e gate
        run: make test-pipeline-local

      - name: Show func host log on failure
        if: failure()
        run: cat .e2e-local-func-host.log || true

      - name: Tear down Azurite
        if: always()
        run: docker compose down -v --remove-orphans

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read         # pull base image from GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Log in to GHCR (pull base image)
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image
        id: base
        run: |
          source .github/image-config.env
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${BASE_IMAGE_REPO}:latest"

          # Try to pull prebuilt base from GHCR; build locally on failure
          if docker pull "${GHCR_IMAGE}" 2>/dev/null; then
            echo "image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "### Base image: pulled from GHCR :package:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Base image not found on GHCR — building from Dockerfile.base"
            LOCAL_TAG="treesight-base:ci-local"
            docker build -f Dockerfile.base -t "${LOCAL_TAG}" .
            echo "image=${LOCAL_TAG}" >> "$GITHUB_OUTPUT"
            echo "### Base image: built locally from Dockerfile.base :hammer:" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build app image
        run: |
          APP_VERSION=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          docker build \
            --build-arg BASE_IMAGE="${{ steps.base.outputs.image }}" \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t treesight:ci-check .

      - name: Run container smoke tests
        run: |
          docker run --rm \
            -e CIAM_AUTHORITY="https://canopex.ciamlogin.com" \
            -e CIAM_TENANT_ID="ci-test-tenant" \
            -e CIAM_API_AUDIENCE="api://ci-test-audience" \
            -v "${{ github.workspace }}/scripts:/scripts:ro" \
            treesight:ci-check \
            python3 /scripts/container_smoke_test.py
