name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review so promoting a draft triggers CI (#1003/#1004).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  # Cancel superseded runs for the same ref on PRs; never cancel main/scheduled runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect CodeQL Scope
    runs-on: ubuntu-latest
    outputs:
      codeql_relevant: ${{ steps.detect.outputs.codeql_relevant }}
    steps:
      - name: Detect changed files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "codeql_relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' > changed-files.txt

          if grep -Eq '^(\.github/workflows/codeql\.yml|function_app.*\.py|function_registration\.py|pyproject\.toml|uv\.lock|blueprints/|scripts/|treesight/|typings/)' changed-files.txt; then
            echo "codeql_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "codeql_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze Python
    needs: changes
    if: needs.changes.outputs.codeql_relevant == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
