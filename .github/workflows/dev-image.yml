# ─────────────────────────────────────────────────────────────
# Dev Image — Build, test, scan, and publish treesight-dev
#
# The containerised dev + CI environment (ADR 0005, epic #1082). Extends
# treesight-base with the locked dependency layer, the treesight_rs PyO3
# extension, and the gate tools (ruff, pyright, pytest, make). Developers consume
# it via .devcontainer; CI gate jobs (#1086) will consume the SAME image by
# digest.
#
# Rebuilds when the dependency lock, the dev Dockerfile, the Rust extension,
# or the devcontainer definition changes — and daily, shortly after the base
# image, to inherit its security updates.
#
# Flow:
#   1. Build Dockerfile.dev (labels the image with the uv.lock digest)
#   2. Smoke test (treesight_rs imports; ruff/pyright/pytest/make present)
#   3. Size gate
#   4. Trivy scan (advisory + SARIF — this is a dev/CI tool image, not a
#      deployed runtime; findings are visible in Code Scanning)
#   5. Push to GHCR with :latest + :YYYYMMDD-<sha> tags
# ─────────────────────────────────────────────────────────────
name: Dev Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.dev"
      - "pyproject.toml"
      - "uv.lock"
      - "rust/**"
      - ".devcontainer/**"
      - ".dockerignore"
      - ".github/image-config.env"
      - ".github/workflows/dev-image.yml"
  schedule:
    # Daily 06:00 UTC — one hour after base-image.yml (05:00) so a fresh
    # treesight-base (Debian security fixes) is inherited within ~24 h.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR
  security-events: write # upload Trivy SARIF

jobs:
  build-test-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Authenticate before any pull/push so the base image (treesight-base on
      # GHCR) is fetched authenticated, avoiding anonymous-pull rate limits.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          source .github/image-config.env
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_NAME="ghcr.io/${OWNER}/${DEV_IMAGE_REPO}"
          BASE_IMAGE="ghcr.io/${OWNER}/${BASE_IMAGE_REPO}:latest"
          DATE_TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          UVLOCK_SHA="$(sha256sum uv.lock | awk '{print $1}')"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "image_dated=${IMAGE_NAME}:${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_e2e_latest=${IMAGE_NAME}:pipeline-e2e-latest" >> "$GITHUB_OUTPUT"
          echo "image_e2e_dated=${IMAGE_NAME}:pipeline-e2e-${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "uv_version=${UV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "uvlock_sha=${UVLOCK_SHA}" >> "$GITHUB_OUTPUT"
          BUILD_INPUTS_SHA="$(python3 scripts/check_dev_image_staleness.py --print-build-digest --dockerfile Dockerfile.dev)"
          echo "build_inputs_sha=${BUILD_INPUTS_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        run: |
          docker build \
            -f Dockerfile.dev \
            --target dev \
            --build-arg BASE_IMAGE="${{ steps.meta.outputs.base_image }}" \
            --build-arg UV_VERSION="${{ steps.meta.outputs.uv_version }}" \
            --build-arg UVLOCK_SHA="${{ steps.meta.outputs.uvlock_sha }}" \
            --build-arg BUILD_INPUTS_SHA="${{ steps.meta.outputs.build_inputs_sha }}" \
            -t "${{ steps.meta.outputs.image_latest }}" \
            -t "${{ steps.meta.outputs.image_dated }}" \
            .

      # pipeline-e2e extends `dev` with Azure Functions Core Tools (~1.3 GB) —
      # kept out of the `dev` tag on purpose so lint/test/integration jobs and
      # devcontainers don't pay that weight. Built in the SAME job/triggers as
      # `dev` so there's one image-update process to maintain, not two.
      - name: Build pipeline-e2e image
        run: |
          docker build \
            -f Dockerfile.dev \
            --target pipeline-e2e \
            --build-arg BASE_IMAGE="${{ steps.meta.outputs.base_image }}" \
            --build-arg UV_VERSION="${{ steps.meta.outputs.uv_version }}" \
            --build-arg UVLOCK_SHA="${{ steps.meta.outputs.uvlock_sha }}" \
            --build-arg BUILD_INPUTS_SHA="${{ steps.meta.outputs.build_inputs_sha }}" \
            -t "${{ steps.meta.outputs.image_e2e_latest }}" \
            -t "${{ steps.meta.outputs.image_e2e_dated }}" \
            .

      # ── Smoke test: gate tools + Rust extension are usable ─
      - name: Smoke test dev image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "${{ steps.meta.outputs.image_latest }}" \
            bash -c '
              set -euo pipefail
              python -c "import treesight_rs; assert hasattr(treesight_rs, \"compute_ndvi_array\")"
              ruff --version
              pyright --version
              python -m pytest --version
              make --version
            '

      - name: Smoke test pipeline-e2e image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "${{ steps.meta.outputs.image_e2e_latest }}" \
            bash -c '
              set -euo pipefail
              make --version
              func --version
            '

      # ── Size gate ──────────────────────────────
      - name: Check image size
        run: |
          SIZE_MB=$(docker image inspect "${{ steps.meta.outputs.image_latest }}" \
            --format '{{ .Size }}' | awk '{printf "%.0f", $1/1024/1024}')
          echo "Image size: ${SIZE_MB} MB"
          # Base (~1 GB) + locked deps (~1 GB, GDAL/rasterio/pyproj/shapely) +
          # node/uv. Fail past 2900 MB — a jump usually means the Rust toolchain
          # leaked out of the builder stage.
          if [ "$SIZE_MB" -gt 2900 ]; then
            echo "::error::Dev image is ${SIZE_MB} MB — exceeds 2900 MB limit. Check Dockerfile.dev multi-stage boundary."
            exit 1
          fi

      - name: Check pipeline-e2e image size
        run: |
          SIZE_MB=$(docker image inspect "${{ steps.meta.outputs.image_e2e_latest }}" \
            --format '{{ .Size }}' | awk '{printf "%.0f", $1/1024/1024}')
          echo "pipeline-e2e image size: ${SIZE_MB} MB"
          # dev budget (2900 MB) + Azure Functions Core Tools (~1.3 GB) + buffer.
          if [ "$SIZE_MB" -gt 4400 ]; then
            echo "::error::pipeline-e2e image is ${SIZE_MB} MB — exceeds 4400 MB limit."
            exit 1
          fi

      # ── Security scan (advisory + SARIF) ───────────────────
      - name: Trivy container scan
        uses: ./.github/actions/trivy-scan
        with:
          scan: image
          image: ${{ steps.meta.outputs.image_latest }}
          image-exit: "0"
          format: sarif
          output: trivy-dev.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: trivy-dev.sarif
          category: trivy-dev-image

      - name: Trivy container scan (pipeline-e2e)
        uses: ./.github/actions/trivy-scan
        with:
          scan: image
          image: ${{ steps.meta.outputs.image_e2e_latest }}
          image-exit: "0"
          format: sarif
          output: trivy-dev-e2e.sarif
          # azure-functions-core-tools-4 bundles multi-language worker runtimes
          # (in-proc .NET, PowerShell) this Python-only app never invokes
          # (func start --python only). Their CVEs aren't reachable attack
          # surface here — scope the scan to skip that unused bundle rather
          # than growing an ever-larger per-CVE .trivyignore for code we don't
          # execute. See #1215/#1219 (why Core Tools is installed at all).
          skip-dirs: usr/lib/azure-functions-core-tools-4

      - name: Upload Trivy SARIF (pipeline-e2e)
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: trivy-dev-e2e.sarif
          category: trivy-dev-pipeline-e2e-image

      # ── Push to GHCR ───────────────────────────────────────
      - name: Push dev image
        env:
          IMAGE_LATEST: ${{ steps.meta.outputs.image_latest }}
          IMAGE_DATED: ${{ steps.meta.outputs.image_dated }}
          IMAGE_E2E_LATEST: ${{ steps.meta.outputs.image_e2e_latest }}
          IMAGE_E2E_DATED: ${{ steps.meta.outputs.image_e2e_dated }}
          UVLOCK_SHA: ${{ steps.meta.outputs.uvlock_sha }}
          BUILD_INPUTS_SHA: ${{ steps.meta.outputs.build_inputs_sha }}
        run: |
          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_DATED"
          docker push "$IMAGE_E2E_LATEST"
          docker push "$IMAGE_E2E_DATED"
          {
            echo "### Dev Image Published :package:"
            echo ""
            echo "- \`$IMAGE_LATEST\`"
            echo "- \`$IMAGE_DATED\`"
            echo "- \`$IMAGE_E2E_LATEST\`"
            echo "- \`$IMAGE_E2E_DATED\`"
            echo "- uv.lock sha256: \`$UVLOCK_SHA\`"
            echo "- build-inputs sha256: \`$BUILD_INPUTS_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
