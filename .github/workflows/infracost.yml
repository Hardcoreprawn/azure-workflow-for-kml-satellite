name: Infracost

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/tofu/**"
      - ".github/workflows/infracost.yml"

permissions:
  contents: read
  pull-requests: write

env:
  BUDGET_GBP: "10"

jobs:
  infracost:
    name: Cost Estimate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Check Infracost API key
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [[ -z "$INFRACOST_API_KEY" ]]; then
            echo "::error::INFRACOST_API_KEY is unavailable. Configure the repository Actions secret; Dependabot runs require a Dependabot secret of the same name."
            exit 1
          fi

      - name: Setup Infracost
        uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          currency: GBP

      - name: Generate Infracost breakdown
        working-directory: infra/tofu
        run: |
          infracost breakdown \
            --path=. \
            --project-name="Dev configuration (committed usage baseline; advisory)" \
            --terraform-var-file=environments/dev.tfvars \
            --usage-file=infracost-usage.yml \
            --format=json \
            --out-file="$RUNNER_TEMP/infracost.json"

      - name: Retain cost-model evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infracost-dev
          path: ${{ runner.temp }}/infracost.json
          retention-days: 14
          if-no-files-found: error

      - name: Report configuration estimate
        shell: bash
        run: |
          {
            echo '## Infracost configuration estimate (advisory)'
            echo 'Uses dev.tfvars and the committed usage baseline, not live Azure usage or a remote-state plan.'
            echo 'Unsupported resources and values known only at plan time may be missing; this is not a billing forecast.'
            echo '```text'
            infracost output --path="$RUNNER_TEMP/infracost.json" --format=table --show-skipped
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check budget threshold
        shell: bash
        run: |
          infracost output \
            --path="$RUNNER_TEMP/infracost.json" \
            --format=json | python3 -c '
          import json
          import os
          import sys
          from decimal import Decimal

          monthly = Decimal(str(json.load(sys.stdin)["totalMonthlyCost"]))
          if not monthly.is_finite():
              raise ValueError("Monthly estimate must be finite")
          budget = Decimal(os.environ["BUDGET_GBP"])
          print(f"Estimated monthly cost (GBP): {monthly}")
          if monthly > budget:
              print(f"::warning::Estimated cost (GBP {monthly}) exceeds advisory budget (GBP {budget}).")
          '

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          infracost comment github \
            --path="$RUNNER_TEMP/infracost.json" \
            --repo="$GH_REPO" \
            --github-token="$GH_TOKEN" \
            --pull-request="$PR_NUMBER" \
            --behavior=update \
            --tag=infracost \
            --show-all-projects \
            --show-skipped

      - name: Report unavailable estimate
        if: failure()
        run: |
          echo "::warning::Infracost estimate unavailable. This advisory job does not block merge or deployment; inspect the failed step for details."
          echo '## Infracost estimate unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Advisory only. No current cost estimate was produced or fully published; any earlier PR comment may be stale. See the failed step above.' >> "$GITHUB_STEP_SUMMARY"
