# ─────────────────────────────────────────────────────────────
# Preview Site TTL Sweep — auto-teardown for stale website previews (#1011)
#
# preview-site.yml already tears down a preview on PR close, but a preview
# left open (PR neither closed nor updated) lingers indefinitely with no
# TTL. This is the "whichever comes first" half: a scheduled sweep that
# tears down any preview whose PR has had no activity for TTL_DAYS days,
# independent of whether the PR itself ever closes.
#
# Scope: website-only preview environments (preview-site.yml's SWA staging
# slots), reusing the same teardown action preview-site.yml's close-preview
# job already uses. Full-stack ephemeral environments (API + data) are
# tracked separately in #1011 and depend on the hosting right-size (#846),
# which is not yet done — do not extend this sweeper to provision/teardown
# API or data resources until that dependency lands.
# ─────────────────────────────────────────────────────────────
name: Preview Site TTL Sweep

on:
  schedule:
    # Once a day is enough for a 1-3 day TTL; avoids burning Actions minutes.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ttl_days:
        description: "Override TTL in days (default 3)"
        required: false
        type: string
        default: "3"

permissions:
  contents: read
  pull-requests: write

jobs:
  find-stale:
    name: Find stale preview PRs
    runs-on: ubuntu-latest
    env:
      TTL_DAYS: ${{ inputs.ttl_days || '3' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      stale_prs: ${{ steps.stale.outputs.numbers }}
    steps:
      - name: Find PRs with a stale website preview
        id: stale
        run: |
          set -euo pipefail
          cutoff_epoch=$(( $(date -u +%s) - TTL_DAYS * 86400 ))

          # Open PRs that touched website/** (the only paths preview-site.yml
          # deploys for) and haven't been updated since the TTL cutoff.
          gh pr list --state open --json number,updatedAt,files \
            --jq '[.[] | select(any(.files[].path; startswith("website/")))]' \
            > open_website_prs.json

          stale_numbers=$(jq -c --argjson cutoff "$cutoff_epoch" '
            [.[] | select((.updatedAt | fromdateiso8601) < $cutoff) | .number]
          ' open_website_prs.json)

          echo "numbers=${stale_numbers}" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$stale_numbers" | jq 'length') stale preview PR(s) (TTL=${TTL_DAYS}d)."

  teardown-stale:
    name: Tear down stale preview
    needs: find-stale
    if: needs.find-stale.outputs.stale_prs != '[]'
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.find-stale.outputs.stale_prs) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TTL_DAYS: ${{ inputs.ttl_days || '3' }}
    steps:
      - name: Close stale SWA staging environment
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: close
          app_location: /website
          deployment_environment: "pr-${{ matrix.pr_number }}"

      - name: Comment on the PR
        run: |
          gh pr comment "${{ matrix.pr_number }}" --repo "${{ github.repository }}" \
            --body "🧹 Preview environment torn down automatically — no activity for ${TTL_DAYS} day(s) (TTL expiry, see #1011). Push a new commit to redeploy a fresh preview."
