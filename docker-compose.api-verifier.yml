# Applied only by `make verify-local-api`; the normal development stack keeps
# auth disabled and uses its existing placeholder CIAM settings.
services:
  func:
    environment:
      CIAM_AUTHORITY: http://local-ciam:8080
      CIAM_TENANT_ID: local-dev-tenant
      CIAM_API_AUDIENCE: api://local-dev-audience
      REQUIRE_AUTH: "true"
    depends_on:
      local-ciam:
        condition: service_healthy

  orch:
    environment:
      CIAM_AUTHORITY: http://local-ciam:8080
      CIAM_TENANT_ID: local-dev-tenant
      CIAM_API_AUDIENCE: api://local-dev-audience
      REQUIRE_AUTH: "true"
    depends_on:
      local-ciam:
        condition: service_healthy

  local-ciam:
    build:
      context: .
      dockerfile: Dockerfile.local-ciam
    environment:
      LOCAL_CIAM_AUTHORITY: http://local-ciam:8080
      LOCAL_CIAM_TENANT_ID: local-dev-tenant
      LOCAL_CIAM_API_AUDIENCE: api://local-dev-audience
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
