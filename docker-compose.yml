services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: canopex-azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - azurite-data:/data
    command: >-
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --loose
      --skipApiVersionCheck
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 5

  init-storage:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: canopex-init
    depends_on:
      azurite:
        condition: service_healthy
    volumes:
      - ./scripts/init_storage_docker.py:/app/init_storage_docker.py:ro
    working_dir: /app
    environment:
      AZURITE_BLOB_HOST: azurite
    command: ["python", "init_storage_docker.py"]
    restart: "no"

  # One-off gate runner used by `make ci-local` / scripts/ci_local.sh (#1086).
  # Runs the integration suite inside the published dev image against the
  # azurite service above, reusing its --skipApiVersionCheck/--loose config and
  # healthcheck-gated ordering. Guarded by the `ci` profile so it never starts
  # with a normal `docker compose up`. The image tag is overridable so the same
  # service can target treesight-dev:local (freshly built) or a pulled digest.
  ci-gate:
    image: ${CI_GATE_IMAGE:-treesight-dev:local}
    profiles: ["ci"]
    depends_on:
      azurite:
        condition: service_healthy
    # CI_GATE_WORKSPACE overrides the bind-mount source when docker compose
    # itself is invoked from inside a Docker-outside-of-Docker devcontainer:
    # `.` there resolves to this container's own filesystem view, which is
    # meaningless to the real Docker Desktop daemon running the sibling
    # containers (see scripts/ci_local.sh's auto-detection).
    volumes:
      - ${CI_GATE_WORKSPACE:-.}:/workspace
    working_dir: /workspace
    environment:
      UV_NO_SYNC: "1"
      AZURITE_BLOB_HOST: azurite
      AzureWebJobsStorage: "UseDevelopmentStorage=true"  # pragma: allowlist secret
    command: ["make", "test-int"]

  func:
    build:
      context: .
      # Dockerfile's own default (`treesight-base:latest`, no registry) only
      # resolves for a caller with a matching local tag already built/pulled
      # (e.g. CI); a fresh clone has nothing local under that name and hits
      # Docker Hub instead, which 404s. Pin to the real published image so
      # `make dev-all` works out of the box for a new dev machine too.
      args:
        BASE_IMAGE: ghcr.io/hardcoreprawn/treesight-base:latest
    container_name: canopex-func
    ports:
      - "7071:80"
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      AzureWebJobsStorage: >-  # pragma: allowlist secret
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1
      AzureWebJobsFeatureFlags: EnableWorkerIndexing
      FUNCTIONS_WORKER_RUNTIME: python
      WEBSITE_HOSTNAME: "localhost:80"
      IMAGERY_PROVIDER: planetary_computer
      IMAGERY_RESOLUTION_TARGET_M: "0.5"
      IMAGERY_MAX_CLOUD_COVER_PCT: "20.0"
      AOI_BUFFER_M: "100.0"
      AOI_MAX_AREA_HA: "10000.0"
      DEMO_VALET_TOKEN_SECRET: local-dev-secret-change-me  # pragma: allowlist secret
      DEMO_VALET_TOKEN_TTL_SECONDS: "86400"
      DEMO_VALET_TOKEN_MAX_USES: "3"
      # Dummy values so treesight.config.validate_config() doesn't fail
      # startup (§8.6 requires these set unconditionally). REQUIRE_AUTH
      # stays unset/false here, so nothing ever verifies these against a
      # real token — mirrors scripts/e2e_local.py's _DUMMY_CIAM_DEFAULTS.
      CIAM_AUTHORITY: "https://ciam.example.com"
      CIAM_TENANT_ID: "local-dev-tenant"
      CIAM_API_AUDIENCE: "api://local-dev-audience"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "mistral"
      # Host.Startup/Host.Triggers.DurableTask/Function categories at
      # Information surface worker indexing + Durable Task hub bootstrap
      # progress (`docker compose logs func`) instead of the near-silent
      # host.json "Warning" default. Azure.* stays at Warning — at
      # Information it logs full request/response headers for every single
      # Azurite call, which is much more noise than signal locally.
      AzureFunctionsJobHost__logging__logLevel__Default: "Information"
      AzureFunctionsJobHost__logging__logLevel__Azure: "Warning"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # Azurite has no real Event Grid, so blob uploads made directly via a SAS
  # URL (blueprints/upload.py's upload_token flow, i.e. every real browser
  # submission) never reach blueprints/pipeline/blob_trigger.py — nothing
  # ever calls its webhook. This relay does what a real Event Grid
  # subscription would: watch kml-input for new uploads and fire the
  # matching synthetic event (#1273; see scripts/dev_event_grid_relay.py
  # for why this is the documented mechanism, not a workaround).
  event-grid-relay:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: canopex-event-grid-relay
    depends_on:
      azurite:
        condition: service_healthy
      func:
        condition: service_healthy
    volumes:
      - ${DEV_WORKSPACE:-.}/scripts:/app/scripts:ro
    working_dir: /app/scripts
    environment:
      AZURITE_BLOB_HOST: azurite
      # Container stdout has no TTY, so Python fully block-buffers by
      # default — logs would only appear once the buffer filled or the
      # process exited, making `docker compose logs` look silent/broken.
      PYTHONUNBUFFERED: "1"
    command: >-
      sh -c "uv pip install --system -q azure-storage-blob httpx &&
      python dev_event_grid_relay.py --func-base http://func:80"
    restart: unless-stopped

  web:
    image: python:3.12-slim
    container_name: canopex-web
    ports:
      - "4280:4280"
    depends_on:
      func:
        condition: service_healthy
    volumes:
      # ${DEV_WORKSPACE:-.} is set by `make dev-all`/`dev-rebuild` (see
      # scripts/detect_dood_workspace.sh) — resolves the real host path when
      # this runs inside a Docker-outside-of-Docker devcontainer, where "."
      # would otherwise mount an empty directory.
      - ${DEV_WORKSPACE:-.}/website:/app/website:ro
      - ${DEV_WORKSPACE:-.}/scripts/dev_server.py:/app/scripts/dev_server.py:ro
    working_dir: /app
    command: >-
      python scripts/dev_server.py --port 4280 --func-host func --func-port 80
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

  ollama:
    image: ollama/ollama:latest
    container_name: canopex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # ollama/ollama's image ships no curl/wget; the `ollama` CLI itself
      # queries the local server and exits non-zero if it's unreachable.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Pre-pull model on startup (optional - comment out if using existing image)
    # Note: This will take time on first run (~4GB download)
    # command: sh -c "ollama pull mistral && ollama serve"

volumes:
  azurite-data:
  ollama-data:
